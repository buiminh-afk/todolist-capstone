services:
  backend:
    image: buiminh03/vntechies-todolist-backend:${IMAGE_TAG}
    container_name: todolist-backend-dev
    restart: unless-stopped

    ports:
      - "${BACKEND_PORT:-5000}:5000"

    environment:
      PORT: 5000
      NODE_ENV: production

      DATABASE_HOST: ${DB_HOST}
      DATABASE_PORT: ${DB_PORT:-5432}
      DATABASE_NAME: ${DB_NAME}
      DATABASE_USER: ${DB_USER}
      DATABASE_PASSWORD: ${DB_PASSWORD}

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:5000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - application-network

  frontend:
    image: buiminh03/vntechies-todolist-frontend:${IMAGE_TAG}
    container_name: todolist-frontend-dev
    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT:-3000}:3000"

    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - application-network

networks:
  application-network:
    driver: bridge